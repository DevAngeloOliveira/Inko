services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [inko-internal]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command: [--config.file=/etc/blackbox/config.yml]
    volumes:
      - ./infra/observability/blackbox.yml:/etc/blackbox/config.yml:ro
    networks: [inko-internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: inko_admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD in the host .env file}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./infra/observability/grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/inko.yml:ro
      - ./infra/observability/grafana/gateway-dashboard.json:/var/lib/grafana/dashboards/gateway.json:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [inko-internal]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
