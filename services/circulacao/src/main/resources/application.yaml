spring:
  application:
    name: circulacao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inko_circulacao}
    username: ${DB_USER:circulacao_user}
    password: ${DB_PASSWORD:}
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
inko:
  catalogo-url: ${CATALOGO_URL:http://localhost:8081}
  usuarios-url: ${USUARIOS_URL:http://localhost:8082}
  http:
    connect-timeout: ${INKO_CIRCULATION_CONNECT_TIMEOUT:300ms}
    read-timeout: ${INKO_CIRCULATION_READ_TIMEOUT:500ms}
