spring:
  application:
    name: circulacao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inko_circulacao}
    username: ${DB_USER:circulacao_user}
    password: ${DB_PASSWORD:}
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
