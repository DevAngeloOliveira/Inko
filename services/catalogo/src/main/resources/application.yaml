spring:
  application:
    name: catalogo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inko_catalogo}
    username: ${DB_USER:catalogo_user}
    password: ${DB_PASSWORD:}
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
