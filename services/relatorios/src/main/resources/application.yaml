spring:
  application:
    name: relatorios
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
inko:
  catalogo-url: ${CATALOGO_URL:http://localhost:8081}
  usuarios-url: ${USUARIOS_URL:http://localhost:8082}
  circulacao-url: ${CIRCULACAO_URL:http://localhost:8083}
  http:
    connect-timeout: ${INKO_REPORT_CONNECT_TIMEOUT:300ms}
    read-timeout: ${INKO_REPORT_READ_TIMEOUT:700ms}
    budget: ${INKO_REPORT_BUDGET:1000ms}
