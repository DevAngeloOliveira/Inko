[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inko-gateway"
version = "0.1.0"
description = "API Gateway INKO"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "httpx>=0.28,<1.0"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["inko_gateway*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
