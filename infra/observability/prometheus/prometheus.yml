global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: inko-gateway
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: [gateway:8000]

  - job_name: inko-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - catalogo:8081
          - usuarios:8082
          - circulacao:8083
          - relatorios:8084
        labels:
          application: inko

  - job_name: inko-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway:8000/health
          - http://web:3000/
        labels:
          application: inko
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
