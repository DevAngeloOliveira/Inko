name: inko

x-inko-logging: &inko-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inko_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: postgres
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Defina CATALOG_DB_PASSWORD no .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?Defina USERS_DB_PASSWORD no .env}
      CIRCULATION_DB_PASSWORD: ${CIRCULATION_DB_PASSWORD:?Defina CIRCULATION_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "inko_admin", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 90s
    logging: *inko-logging
    networks: [inko-internal]

  catalogo:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: catalogo
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/inko_catalogo
      DB_USER: catalogo_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Defina CATALOG_DB_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *inko-logging
    networks: [inko-internal]

  usuarios:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: usuarios
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/inko_usuarios
      DB_USER: usuarios_user
      DB_PASSWORD: ${USERS_DB_PASSWORD:?Defina USERS_DB_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *inko-logging
    networks: [inko-internal]

  circulacao:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: circulacao
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/inko_circulacao
      DB_USER: circulacao_user
      DB_PASSWORD: ${CIRCULATION_DB_PASSWORD:?Defina CIRCULATION_DB_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *inko-logging
    networks: [inko-internal]

  relatorios:
    build:
      context: .
      dockerfile: infra/docker/java-service.Dockerfile
      args:
        SERVICE: relatorios
    environment:
      SERVER_PORT: 8084
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *inko-logging
    networks: [inko-internal]

  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    environment:
      CATALOGO_URL: http://catalogo:8081
      USUARIOS_URL: http://usuarios:8082
      CIRCULACAO_URL: http://circulacao:8083
      RELATORIOS_URL: http://relatorios:8084
    depends_on:
      catalogo: {condition: service_started}
      usuarios: {condition: service_started}
      circulacao: {condition: service_started}
      relatorios: {condition: service_started}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *inko-logging
    networks: [inko-internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *inko-logging
    networks: [inko-internal]

volumes:
  postgres_data:

networks:
  inko-internal:
    driver: bridge
