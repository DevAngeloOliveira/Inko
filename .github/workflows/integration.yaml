name: INKO Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

permissions:
  contents: read

concurrency:
  group: inko-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Full Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set ephemeral CI credentials
        run: cp .env.example .env
      - name: Start all services and wait for health
        run: docker compose up --detach --build --wait --wait-timeout 600
      - name: Validate HTTP routes, backends and static assets
        run: bash scripts/ci/smoke-compose.sh
      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
