name: INKO Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'compose*.yaml'
      - 'apps/**'
      - 'services/**'
      - 'infra/**'
      - 'scripts/ci/**'
      - 'scripts/ops/measure-gateway.py'
      - 'scripts/ops/test_measure_gateway.py'
      - '.github/workflows/integration.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

permissions:
  contents: read

concurrency:
  group: inko-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Full Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set ephemeral CI credentials
        run: |
          cp .env.example .env
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_password"
          sed -i '/^INKO_BOOTSTRAP_ADMIN_\(EMAIL\|PASSWORD\)=/d' .env
          printf 'INKO_BOOTSTRAP_ADMIN_EMAIL=ci-admin@inko.local\nINKO_BOOTSTRAP_ADMIN_PASSWORD=%s\n' "$admin_password" >> .env
          printf 'INKO_E2E_EMAIL=ci-admin@inko.local\nINKO_E2E_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"
      - name: Start all services and wait for health
        run: docker compose up --detach --build --wait --wait-timeout 600
      - name: Validate HTTP routes, backends and static assets
        run: bash scripts/ci/smoke-compose.sh
      - name: Run the academic library workflow against PostgreSQL
        run: |
          python3 scripts/ci/e2e-academic-flow.py http://127.0.0.1:8000
          python3 scripts/ci/e2e-academic-flow.py http://127.0.0.1:3000
      - name: Verify operator sessions and durable catalog covers (SDD-002)
        run: |
          python3 scripts/ci/e2e-mvp-auth-media.py http://127.0.0.1:3000
          docker compose restart catalogo web
          python3 scripts/ci/e2e-mvp-auth-media.py http://127.0.0.1:3000 --after-restart
          docker compose stop
          docker compose up --detach --wait --wait-timeout 600
          python3 scripts/ci/e2e-mvp-auth-media.py http://127.0.0.1:3000 --after-restart
      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
