name: INKO Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'compose*.yaml'
      - 'apps/**'
      - 'services/**'
      - 'infra/**'
      - 'scripts/ci/**'
      - 'scripts/ops/measure-gateway.py'
      - 'scripts/ops/test_measure_gateway.py'
      - '.github/workflows/integration.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

permissions:
  contents: read

concurrency:
  group: inko-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Full Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set ephemeral CI credentials
        run: cp .env.example .env
      - name: Start all services and wait for health
        run: docker compose up --detach --build --wait --wait-timeout 600
      - name: Validate HTTP routes, backends and static assets
        run: bash scripts/ci/smoke-compose.sh
      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
