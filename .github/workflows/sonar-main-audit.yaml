name: INKO SonarCloud Baseline Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inko-sonar-baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inspect-main:
    name: Inspect SonarCloud main baseline
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify revision audit contract
        run: python scripts/ci/test_sonar_main_audit.py
      - name: Fetch revision-bound Quality Gate and open issues
        timeout-minutes: 11
        env:
          SONAR_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SONAR_TOKEN || '' }}
          INKO_STRICT_SONAR: ${{ github.event_name != 'pull_request' }}
          INKO_PR_NUMBER: ${{ github.event.pull_request.number }}
          INKO_PR_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "$INKO_STRICT_SONAR" == "true" ]]; then
            python scripts/ci/sonar-main-audit.py --strict --expected-sha "$GITHUB_SHA"
          else
            python scripts/ci/sonar-main-audit.py --pull-request "$INKO_PR_NUMBER" --expected-sha "$INKO_PR_SHA"
          fi
