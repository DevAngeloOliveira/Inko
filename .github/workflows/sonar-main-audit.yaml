name: INKO SonarCloud Baseline Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inko-sonar-baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inspect-main:
    name: Inspect SonarCloud main baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fetch main Quality Gate and open security issues
        env:
          SONAR_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SONAR_TOKEN || '' }}
          INKO_STRICT_SONAR: ${{ github.event_name != 'pull_request' }}
          INKO_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [[ "$INKO_STRICT_SONAR" == "true" ]]; then
            python scripts/ci/sonar-main-audit.py --strict
          else
            python scripts/ci/sonar-main-audit.py --pull-request "$INKO_PR_NUMBER"
          fi
