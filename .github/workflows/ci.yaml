name: INKO CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inko-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate shell scripts
        run: bash -n scripts/ci/smoke-compose.sh scripts/ops/backup-postgres.sh scripts/ops/deploy-staging.sh
      - name: Validate release overlay
        run: |
          INKO_RELEASE_TAG=v0.0.0 docker compose --env-file .env.example -f compose.yaml -f compose.release.yaml config --quiet

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
        working-directory: apps/gateway
      - run: python -m pytest -q
        working-directory: apps/gateway

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalogo, usuarios, circulacao, relatorios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - run: mvn -B -ntp test
        working-directory: services/${{ matrix.service }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: node packages/design-tokens/scripts/generate.mjs --check
      - run: node --test packages/design-tokens/tests/*.test.mjs
      - run: pnpm --filter @inko/web typecheck
      - run: pnpm --filter @inko/web test
      - run: pnpm --filter @inko/web build
      - name: Build standalone Docker image
        run: docker build --file apps/web/Dockerfile --tag inko-web:smoke .
      - name: Smoke test static assets from the running container
        run: |
          docker run --detach --name inko-web-smoke --env HOSTNAME=0.0.0.0 --publish 127.0.0.1:3000:3000 inko-web:smoke
          trap 'docker rm --force inko-web-smoke >/dev/null 2>&1 || true' EXIT
          node apps/web/scripts/smoke-static-assets.mjs

  publish:
    name: Publish ${{ matrix.component }} to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compose, gateway, java, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: apps/web/Dockerfile
            context: .
            build_args: ''
          - component: gateway
            dockerfile: apps/gateway/Dockerfile
            context: ./apps/gateway
            build_args: ''
          - component: catalogo
            dockerfile: infra/docker/java-service.Dockerfile
            context: .
            build_args: SERVICE=catalogo
          - component: usuarios
            dockerfile: infra/docker/java-service.Dockerfile
            context: .
            build_args: SERVICE=usuarios
          - component: circulacao
            dockerfile: infra/docker/java-service.Dockerfile
            context: .
            build_args: SERVICE=circulacao
          - component: relatorios
            dockerfile: infra/docker/java-service.Dockerfile
            context: .
            build_args: SERVICE=relatorios
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag and ancestry
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Compute lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
