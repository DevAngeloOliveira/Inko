name: Bootstrap pnpm lockfile
on:
  push:
    branches:
      - feat/sprint-00-frontend-foundations
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@10.15.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): lock pnpm workspace dependencies [skip ci]"
            git push
          fi
