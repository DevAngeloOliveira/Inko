name: INKO Temporary Python Lock Generator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generate-python-lock.yaml'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.7'
      - name: Produce lock from project metadata
        working-directory: apps/gateway
        shell: bash
        run: |
          uv lock --python 3.13
          echo 'INKO_LOCK_BEGIN'
          base64 -w 0 uv.lock
          echo
          echo 'INKO_LOCK_END'
